name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *" # noturno: mais iterações de fuzz quando existirem

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: swift-format (estrito)
        run: swift format lint --strict -r Sources Tests Package.swift
      - name: Construções proibidas
        run: scripts/check-forbidden.sh

  linux:
    runs-on: ubuntu-24.04
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Build (avisos são erros via Package.swift)
        run: swift build
      - name: Testes
        run: swift test
      - name: Thread Sanitizer
        run: swift test --sanitize=thread
      - name: Benchmarks (JSON)
        run: swift run -c release caju-bench | tee bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-linux
          path: bench.json

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable # Swift 6.2 exige Xcode 26+
      - run: swift --version
      - name: Build e testes
        run: swift build && swift test
      - name: Build para iOS (device)
        run: xcodebuild -scheme Caju-Package -destination 'generic/platform=iOS' build

  android:
    # Experimental até o TB-Android fixar o SDK e o kill-criteria (ADR 0008).
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: skiptools/swift-android-action@v2
        with:
          swift-version: "6.2"
          android-api-level: 29
          build-tests: true
          run-tests: false

  android-apk:
    # APK de depuração do host Android (V-1, fatia F; ADR 0024). Toolchain do swift.org 6.4.2 (o `swift build
    # --product` liga direto para Android) + Swift SDK for Android 6.4.2 + NDK r30. Experimental até ficar verde.
    runs-on: ubuntu-24.04
    continue-on-error: true
    env:
      NDK_VERSION: 30.0.15729638
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Swift 6.4.2 (swift.org)
        run: |
          curl -fsSL -o swift.tar.gz https://download.swift.org/swift-6.4.2-release/ubuntu2404/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE-ubuntu24.04.tar.gz
          mkdir -p "$HOME/swift" && tar xzf swift.tar.gz -C "$HOME/swift" --strip-components=1
          echo "$HOME/swift/usr/bin" >> "$GITHUB_PATH"
      - name: Swift SDK for Android 6.4.2
        run: |
          swift --version
          swift sdk install https://download.swift.org/swift-6.4.2-release/android-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_android.artifactbundle.tar.gz \
            --checksum 4d6ad63ea74becd58e123ff58b1b48c3be5ec0db0dff0ea5abe37ac007dd3233
      - name: NDK r30 ligado ao Swift SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" sh "$(ls -d "$HOME"/.swiftpm/swift-sdks/*android*/swift-android/scripts/setup-android-sdk.sh)"
      - name: APK (assembleDebug)
        run: cd Hosts/Android && ./gradlew --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: caju-host-debug-apk
          path: Hosts/Android/app/build/outputs/apk/debug/app-debug.apk

  apple-host:
    # Experimental até a primeira execução verde (Hosts/Apple/README.md).
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable # Swift 6.2 exige Xcode 26+
      - run: brew install xcodegen
      - run: cd Hosts/Apple && xcodegen generate
      - run: cd Hosts/Apple && xcodebuild -project CajuHost.xcodeproj -scheme CajuHost-macOS build CODE_SIGNING_ALLOWED=NO
      - run: cd Hosts/Apple && xcodebuild -project CajuHost.xcodeproj -scheme CajuHost-iOS -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
