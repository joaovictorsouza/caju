# Projeto gerado com XcodeGen (`brew install xcodegen && xcodegen generate` nesta pasta).
# O .xcodeproj não é versionado (.gitignore). Mínimos: iOS 17 / macOS 14 (ADR 0007).
name: CajuHost
options:
  bundleIdPrefix: dev.caju
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  Caju:
    path: ../..
targets:
  CajuHost-iOS:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: Caju
        product: CajuMath
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.caju.host
  CajuHost-macOS:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: Caju
        product: CajuMath
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.caju.host
